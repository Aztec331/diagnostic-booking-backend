services:
  db:
    image: postgres:16
    container_name: diagnostic_booking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diagnostic_booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: diagnostic_booking_api
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: